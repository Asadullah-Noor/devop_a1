
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Bites | Feedback</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<header>
    <h2 class="logo">Campus <span>Bites</span></h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="deals.html">Deals</a>
        <a href="order.html">Order</a>
        <a class="active" href="feedback.html">Feedback</a>
    </nav>
</header>

<section class="page-title">
    <h1>Feedback & Contact</h1>
    <p>We value your suggestions and feedback.</p>
</section>

<section class="container">
    <div class="feedback-box">
        <h2>Share Your Feedback</h2>

        <form>
            <label>Your Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">

            <label>Your Message</label>
            <textarea rows="5" placeholder="Write your feedback"></textarea>

            <button class="btn" type="submit">Submit Feedback</button>
        </form>
    </div>

    <div class="contact">
        <h2>Contact Information</h2>
        <p><strong>Location:</strong> University Main Cafeteria</p>
        <p><strong>Email:</strong> campusbites@example.com</p>
        <p><strong>Hours:</strong> Monday - Friday, 8 AM - 6 PM</p>
    </div>
</section>

<footer>
    <p>© 2026 Campus Bites</p>
</footer>

</body>
</html>
